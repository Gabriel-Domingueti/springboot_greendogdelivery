<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Pedido</title>
</head>
<body>
<h1 layout:fragment="header">Cadastro de Pedido</h1>

<div layout:fragment="content" class="container">
    <div class="well">

        <form id="pedidoForm" th:action="@{/pedidos/(form)}" th:object="${pedido}" action="#" method="post" class="form-horizontal">

            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                <p th:each="error : ${#fields.errors('*')}" th:text="${error}">
                    Erro de validacao
                </p>
            </div>

            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label class="control-label col-sm-2" for="cliente">Cliente</label>
                <div class="col-sm-10">
                    <!-- Espera que o Controller envie uma lista de '${clientes}' -->
                    <select class="form-control" th:field="*{cliente}" th:classappend="${#fields.hasErrors('cliente')} ? 'is-invalid'">
                        <option value="">Selecione um cliente...</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-sm-2" for="itens">Itens</label>
                <div class="col-sm-10">
                    <!-- Espera que o Controller envie uma lista de '${todosItens}' -->
                    <select multiple="multiple" class="form-control" th:field="*{itens}" th:classappend="${#fields.hasErrors('itens')} ? 'is-invalid'">
                        <option th:each="i : ${todosItens}" th:value="${i.id}" th:text="${i.nome} + ' (R$ ' + ${i.preco} + ')'"></option>
                    </select>
                    <small class="text-muted">Segure CTRL (ou CMD) para selecionar múltiplos itens.</small>
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-sm-2" for="data">Data do Pedido</label>
                <div class="col-sm-10">
                    <input type="date" class="form-control" th:field="*{data}" th:classappend="${#fields.hasErrors('data')} ? 'is-invalid'" />
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-sm-2" for="valorTotal">Valor Total</label>
                <div class="col-sm-10">
                    <input type="number" step="0.01" class="form-control" th:field="*{valorTotal}" th:classappend="${#fields.hasErrors('valorTotal')} ? 'is-invalid'" />
                </div>
            </div>

            <div class="form-group">
                <div class="col-sm-offset-2 col-sm-10">
                    <button type="submit" class="btn btn-success">Gravar</button>
                    <a th:href="@{/pedidos/}" class="btn btn-default" style="margin-left: 10px;">Voltar</a>
                </div>
            </div>

        </form>

    </div>
</div>
</body>
</html>
